<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKSAM - Espace Télétravail</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-overlay: rgba(5, 7, 11, 0.85);
      --card-bg: rgba(15, 23, 42, 0.78);
      --border: rgba(56, 189, 248, 0.2);
      --primary: #38bdf8;
      --accent: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    
    /* Arrière-plan photo entreprise professionnel avec overlay sombre */
    body { 
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }
    
    .container { width: 100%; max-width: 480px; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); text-align: center; }

    .company-logo { font-size: 0.8rem; font-weight: 700; letter-spacing: 3px; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    
    input, select, textarea { width: 100%; padding: 14px 18px; background: rgba(3, 7, 18, 0.9); border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; font-size: 1rem; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }

    .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; font-size: 1rem; margin-bottom: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #05070b; box-shadow: 0 10px 20px rgba(56,189,248,0.2); }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-success { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.4); }
    .btn-warning { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.4); }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
    
    .btn-logout { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); width: auto; padding: 8px 16px; font-size: 0.85rem; border-radius: 8px; float: right; margin-bottom: 15px; }
    .btn-logout:hover { background: rgba(248, 113, 113, 0.2); }

    #employee-dashboard { display: none; width: 100%; max-width: 520px; }
    .user-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .user-details { display: flex; align-items: center; gap: 12px; text-align: left; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #05070b; font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- VUE : CONNEXION -->
  <div class="container" id="login-view">
    <div class="glass-card">
      <div class="company-logo">AKSAM Enterprise</div>
      <h1>Portail Sécurisé</h1>
      <p class="subtitle">Système de Suivi & Télétravail</p>

      <form id="login-form">
        <div class="form-group">
          <label>Type de Connexion</label>
          <select id="role-select">
            <option value="employee">Collaborateur / Employé</option>
            <option value="admin">Administrateur</option>
          </select>
        </div>

        <div class="form-group" id="name-group">
          <label>Nom complet (Identifiant)</label>
          <input type="text" id="login-name" placeholder="Ex: Cledor Sow">
        </div>

        <div class="form-group">
          <label>Code PIN secret</label>
          <input type="password" id="login-pin" placeholder="••••" required>
        </div>

        <button type="submit" class="btn btn-primary">Connexion au réseau</button>
      </form>
      <div id="login-error" style="color: var(--danger); margin-top: 15px; font-size: 0.85rem; display: none;"></div>
    </div>
  </div>

  <!-- VUE : TABLEAU DE BORD EMPLOYÉ -->
  <div id="employee-dashboard">
    <div class="glass-card">
      <div class="user-info">
        <div class="user-details">
          <div class="avatar" id="user-initial">C</div>
          <div>
            <h2 id="welcome-name" style="font-size: 1.2rem;">Bonjour</h2>
            <p style="color: var(--success); font-size: 0.8rem;" id="current-status-text">● Hors ligne</p>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">⏻ Déconnexion</button>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>💻 Application ou Outil actif :</label>
        <input type="text" id="current-app" placeholder="Ex: VS Code, Excel, Navigateur..." required>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-success" onclick="updateStatus('ONLINE')">🟢 En Service</button>
        <button class="btn btn-warning" onclick="updateStatus('PAUSE')">🟡 Pause</button>
        <button class="btn btn-danger" onclick="updateStatus('OFFLINE')">🔴 Fin</button>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>📝 Rapport de tâche et avancement :</label>
        <textarea id="task-desc" rows="3" placeholder="Décrivez votre avancement..."></textarea>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>📸 Captures d'écran (5 Max) :</label>
        <input type="file" id="task-screenshots" accept="image/*" multiple style="padding: 10px; background: rgba(3,7,18,0.9); border: 1px solid var(--border); border-radius: 12px; color: white;">
      </div>

      <button class="btn btn-primary" onclick="submitTask()">Envoyer le rapport quotidien</button>
    </div>
  </div>

  <script>
    let currentEmployee = '';
    let inactivityTimer;
    const INACTIVITY_LIMIT = 10 * 60 * 1000;

    document.getElementById('role-select').addEventListener('change', function(e) {
      const nameGroup = document.getElementById('name-group');
      nameGroup.style.display = (e.target.value === 'admin') ? 'none' : 'block';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.getElementById('role-select').value;
      const name = document.getElementById('login-name').value.trim();
      const pin = document.getElementById('login-pin').value.trim();
      const errorDiv = document.getElementById('login-error');
      
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, pin, role })
        });
        const data = await res.json();

        if (data.success) {
          if (data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            currentEmployee = data.name;
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('employee-dashboard').style.display = 'block';
            document.getElementById('welcome-name').innerText = currentEmployee;
            document.getElementById('user-initial').innerText = currentEmployee.charAt(0).toUpperCase();
            initInactivityDetector();
          }
        } else {
          errorDiv.innerText = data.message || "Identifiants incorrects";
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = "Erreur serveur.";
        errorDiv.style.display = 'block';
      }
    });

    async function updateStatus(status) {
      const appName = document.getElementById('current-app').value.trim() || 'Non spécifié';
      let locationStr = "Non localisé";

      if (status === 'ONLINE') {
        if (!navigator.geolocation) {
          alert("❌ Géolocalisation non supportée.");
          return;
        }
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, enableHighAccuracy: true });
          });
          locationStr = `Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`;
        } catch(e) {
          alert("❌ Accès GPS refusé. Vous devez autoriser la géolocalisation pour vous mettre en service.");
          return;
        }
      }

      try {
        await fetch('/api/pointage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employe: currentEmployee, status, location: locationStr, currentApp: appName })
        });
        
        const statusText = document.getElementById('current-status-text');
        if(status === 'ONLINE') statusText.innerText = `● En service (${appName})`;
        if(status === 'PAUSE') statusText.innerText = "● En pause";
        if(status === 'OFFLINE') statusText.innerText = "● Hors ligne";
        
        if(status !== 'PAUSE') alert("Statut enregistré avec succès !");
      } catch (err) {
        alert("Erreur réseau.");
      }
    }

    function initInactivityDetector() {
      const resetTimer = () => {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(autoSwitchToPause, INACTIVITY_LIMIT);
      };
      window.onload = resetTimer;
      window.onmousemove = resetTimer;
      window.onclick = resetTimer;
      window.onkeypress = resetTimer;
    }

    async function autoSwitchToPause() {
      await fetch('/api/pointage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employe: currentEmployee, status: 'PAUSE', currentApp: 'Inactivité' })
      });
      document.getElementById('current-status-text').innerText = "● En pause (Inactivité)";
      alert("⚠️ Basculement automatique en pause suite à 10 minutes d'inactivité.");
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    async function submitTask() {
      const tache = document.getElementById('task-desc').value.trim();
      const appName = document.getElementById('current-app').value.trim();
      const fileInput = document.getElementById('task-screenshots');

      if (!tache) return alert("Veuillez décrire votre tâche.");

      let screenshots = [];
      if (fileInput.files.length > 0) {
        if (fileInput.files.length > 5) return alert("⚠️ Maximum 5 captures d'écran autorisées.");
        for (let i = 0; i < fileInput.files.length; i++) {
          screenshots.push(await toBase64(fileInput.files[i]));
        }
      }

      await fetch('/api/taches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employe: currentEmployee, tache, currentApp: appName, screenshots })
      });
      alert("Rapport envoyé avec succès !");
      document.getElementById('task-desc').value = '';
      fileInput.value = '';
    }

    function logout() {
      currentEmployee = '';
      document.getElementById('employee-dashboard').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('login-form').reset();
    }
  </script>
</body>
</html>
