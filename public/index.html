<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Espace Télétravail</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070b;
      --card-bg: rgba(13, 19, 33, 0.75);
      --border: rgba(56, 189, 248, 0.15);
      --primary: #38bdf8;
      --accent: #c084fc;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 45%), radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.12) 0%, transparent 45%); display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 480px; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); text-align: center; }

    h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    
    input, select, textarea { width: 100%; padding: 14px 18px; background: rgba(5, 7, 11, 0.8); border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; font-size: 1rem; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

    .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; font-size: 1rem; margin-bottom: 10px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #05070b; }
    .btn-success { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
    .btn-warning { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    #employee-dashboard { display: none; width: 100%; max-width: 520px; }
    .user-info { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #05070b; font-size: 1.4rem; }
  </style>
</head>
<body>

  <!-- VUE : CONNEXION -->
  <div class="container" id="login-view">
    <div class="glass-card">
      <h1>Nexus Connect</h1>
      <p class="subtitle">Portail d'Accès Télétravail</p>

      <form id="login-form">
        <div class="form-group">
          <label>Je me connecte en tant que :</label>
          <select id="role-select">
            <option value="employee">Employé (Télétravailleur)</option>
            <option value="admin">Administrateur (Supervision)</option>
          </select>
        </div>

        <div class="form-group" id="name-group">
          <label>Nom complet (Identifiant)</label>
          <input type="text" id="login-name" placeholder="Ex: Cledor Sow">
        </div>

        <div class="form-group">
          <label>Code PIN secret</label>
          <input type="password" id="login-pin" placeholder="****" required>
        </div>

        <button type="submit" class="btn btn-primary">Accéder à mon espace</button>
      </form>
      <div id="login-error" style="color: var(--danger); margin-top: 15px; font-size: 0.85rem; display: none;"></div>
    </div>
  </div>

  <!-- VUE : TABLEAU DE BORD EMPLOYÉ -->
  <div id="employee-dashboard">
    <div class="glass-card">
      <div class="user-info">
        <div class="avatar" id="user-initial">C</div>
        <div>
          <h2 id="welcome-name">Bonjour</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem;" id="current-status-text">Statut : Hors ligne</p>
        </div>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>💻 Application ou Outil actif :</label>
        <input type="text" id="current-app" placeholder="Ex: VS Code, Excel, Chrome..." required>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-success" onclick="updateStatus('ONLINE')">🟢 En Service</button>
        <button class="btn btn-warning" onclick="updateStatus('PAUSE')">🟡 Pause</button>
        <button class="btn btn-danger" onclick="updateStatus('OFFLINE')">🔴 Fin de service</button>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>📝 Rapport de tâche et avancement :</label>
        <textarea id="task-desc" rows="3" placeholder="Qu'avez-vous accompli ?"></textarea>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>📸 Captures d'écran justificatives (5 Max) :</label>
        <input type="file" id="task-screenshots" accept="image/*" multiple style="padding: 10px; background: rgba(5,7,11,0.8); border: 1px solid var(--border); border-radius: 12px; color: white;">
        <small style="color: var(--text-muted); display: block; margin-top: 5px; font-size: 0.75rem;">Sélectionnez jusqu'à 5 images de votre travail.</small>
      </div>

      <button class="btn btn-primary" onclick="submitTask()">Envoyer le rapport avec preuves</button>
      
      <div style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 15px;">
        <button class="btn" style="background: transparent; color: var(--danger); font-size: 0.9rem;" onclick="logout()">Se déconnecter</button>
      </div>
    </div>
  </div>

  <script>
    let currentEmployee = '';
    let inactivityTimer;
    const INACTIVITY_LIMIT = 10 * 60 * 1000; // 10 minutes

    document.getElementById('role-select').addEventListener('change', function(e) {
      const nameGroup = document.getElementById('name-group');
      nameGroup.style.display = (e.target.value === 'admin') ? 'none' : 'block';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.getElementById('role-select').value;
      const name = document.getElementById('login-name').value.trim();
      const pin = document.getElementById('login-pin').value.trim();
      const errorDiv = document.getElementById('login-error');
      
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, pin, role })
        });
        const data = await res.json();

        if (data.success) {
          if (data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            currentEmployee = data.name;
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('employee-dashboard').style.display = 'block';
            document.getElementById('welcome-name').innerText = `Bonjour, ${currentEmployee}`;
            document.getElementById('user-initial').innerText = currentEmployee.charAt(0).toUpperCase();
            initInactivityDetector();
          }
        } else {
          errorDiv.innerText = data.message || "Identifiants incorrects";
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = "Erreur serveur.";
        errorDiv.style.display = 'block';
      }
    });

    async function updateStatus(status) {
      const appName = document.getElementById('current-app').value.trim() || 'Non spécifié';
      let locationStr = "Non localisé";
      if (status === 'ONLINE' && navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
          });
          locationStr = `Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`;
        } catch(e) {
          locationStr = "GPS refusé";
        }
      }

      try {
        await fetch('/api/pointage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employe: currentEmployee, status, location: locationStr, currentApp: appName })
        });
        
        const statusText = document.getElementById('current-status-text');
        if(status === 'ONLINE') statusText.innerText = `Statut : 🟢 En service (${appName})`;
        if(status === 'PAUSE') statusText.innerText = "Statut : 🟡 En pause";
        if(status === 'OFFLINE') statusText.innerText = "Statut : 🔴 Hors ligne";
        
        if(status !== 'PAUSE') alert("Statut mis à jour avec succès !");
      } catch (err) {
        alert("Erreur lors de la mise à jour.");
      }
    }

    function initInactivityDetector() {
      const resetTimer = () => {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
          autoSwitchToPause();
        }, INACTIVITY_LIMIT);
      };

      window.onload = resetTimer;
      window.onmousemove = resetTimer;
      window.onmousedown = resetTimer;
      window.onclick = resetTimer;
      window.onkeypress = resetTimer;
      window.addEventListener('scroll', resetTimer, true);
    }

    async function autoSwitchToPause() {
      try {
        await fetch('/api/pointage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employe: currentEmployee, status: 'PAUSE', currentApp: 'Inactif (Absence de mouvement)' })
        });
        document.getElementById('current-status-text').innerText = "Statut : 🟡 En pause (Inactivité)";
        alert("⚠️ Basculement automatique en 'Pause' suite à 10 minutes d'inactivité.");
      } catch (e) {
        console.error("Erreur auto-pause", e);
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    async function submitTask() {
      const tache = document.getElementById('task-desc').value.trim();
      const appName = document.getElementById('current-app').value.trim();
      const fileInput = document.getElementById('task-screenshots');

      if (!tache) return alert("Veuillez décrire votre tâche.");

      let screenshots = [];
      if (fileInput.files.length > 0) {
        if (fileInput.files.length > 5) {
          return alert("⚠️ Maximum 5 captures d'écran autorisées par rapport.");
        }
        for (let i = 0; i < fileInput.files.length; i++) {
          const base64 = await toBase64(fileInput.files[i]);
          screenshots.push(base64);
        }
      }

      try {
        await fetch('/api/taches', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employe: currentEmployee, tache, currentApp: appName, screenshots })
        });
        alert("Rapport et captures envoyés avec succès !");
        document.getElementById('task-desc').value = '';
        fileInput.value = '';
      } catch (err) {
        alert("Erreur lors de l'envoi.");
      }
    }

    function logout() {
      currentEmployee = '';
      document.getElementById('employee-dashboard').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('login-form').reset();
    }
  </script>
</body>
</html>
