<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Espace Collaborateur — AKSAM</title>
<link rel="stylesheet" href="style.css" />
<script src="/theme.js"></script>
</head>
<body>
<div class="wrap" style="max-width:420px; padding-top:60px;">
  <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
    <button id="themeToggle" class="theme-toggle" title="Changer de thème">☀️</button>
  </div>
  <div class="hero" style="padding:32px 24px;">
    <div class="hero-mark" style="width:64px; height:64px;">
      <img src="/logo.svg" alt="Logo AKSAM" width="40" height="40" />
    </div>
    <h1 class="hero-brand" style="font-size:26px;">AKSAM ENTERPRISE</h1>
    <p class="hero-tagline">Système de Suivi & Télétravail (Employé)</p>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="card">
    <div class="label">Nom complet (Identifiant Employé)</div>
    <input type="text" id="username" placeholder="Ex: Amadou Sow" />

    <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:22px;">Accéder à mon espace</button>
  </div>

  <p class="footnote"><a href="/login.html" style="color:var(--text-dim); text-decoration:none;">🔒 Accès Espace Administration</a></p>
</div>

<script>
const errorBox = document.getElementById("error");
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function clearError() { errorBox.style.display = "none"; }

async function attemptEmployeLogin() {
  clearError();
  const username = document.getElementById("username").value.trim();
  const btn = document.getElementById("loginBtn");
  
  if (!username) {
    showError("Veuillez saisir votre nom d'employé.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Connexion…";
  
  try {
    const res = await fetch("/api/employe/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username }),
    });
    
    const data = await res.json().catch(() => null);

    if (res.ok && data && data.success) {
      window.location.href = "/employe.html";
      return;
    }
    
    showError((data && data.error) || "Nom d'employé non trouvé.");
  } catch (e) {
    showError("Impossible de contacter le serveur.");
  }
  
  btn.disabled = false;
  btn.textContent = "Accéder à mon espace";
}

document.getElementById("loginBtn").onclick = attemptEmployeLogin;
document.getElementById("username").addEventListener("keydown", (e) => {
  if (e.key === "Enter") attemptEmployeLogin();
});
</script>
</body>
</html>
