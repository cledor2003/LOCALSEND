<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AKSAM — Pointage</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo"><img src="/logo.svg" alt="Logo AKSAM" /></div>
    <div>
      <h1>AKSAM — Pointage</h1>
      <p>Enregistre ton arrivée, ta pause et ton départ</p>
    </div>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="card">
    <div class="label">Qui pointe ?</div>
    <div id="employeeChips" class="chip-row"></div>
  </div>

  <div id="employeeCard" style="display:none;" class="card center-card">
    <div class="sub">Connecté en tant que</div>
    <div id="employeeName" class="employee-name"></div>
    <div id="statusBadge"></div>
    <div id="lastRecord" class="sub mono" style="margin-top:10px;"></div>

    <div id="pinSection" style="margin-top:22px; max-width:220px; margin-left:auto; margin-right:auto;">
      <div class="label">🔒 Code PIN</div>
      <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••" />
      <div id="pinError" style="color:#fb7185; font-size:12px; margin-top:4px;"></div>
      <button id="pinBtn" class="btn btn-dark btn-block">Valider le code</button>
    </div>

    <div id="actionButtons" class="btn-row" style="display:none; margin-top:22px;"></div>
    <div class="sub" style="margin-top:14px;">📍 Ta position sera enregistrée avec l'heure</div>

    <button id="switchUserBtn" class="btn btn-dark" style="margin-top:18px; font-size:13px; padding:9px 16px;">↩ Ce n'est pas moi / Changer de personne</button>
  </div>

  <div id="todayCard" style="display:none;" class="card">
    <div class="label" style="margin-bottom:8px;">Aujourd'hui</div>
    <div id="todayList"></div>
  </div>

  <p class="footnote"><a href="/" style="color:var(--text-dim); text-decoration:none;">← Retour à l'accueil</a></p>
</div>

<script>
let employees = [];
let records = [];
let currentEmployeeId = null;
let pinUnlocked = false;

const errorBox = document.getElementById("error");
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function clearError() { errorBox.style.display = "none"; }

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function todayKey(iso) { return new Date(iso).toISOString().slice(0, 10); }

const LABELS = {
  in: "Arrivée",
  out: "Départ",
  pause_start: "Début de pause",
  pause_end: "Fin de pause",
};

async function loadAll() {
  const [empRes, recRes] = await Promise.all([fetch("/api/employees"), fetch("/api/records")]);
  employees = await empRes.json();
  records = await recRes.json();
  renderChips();
  if (currentEmployeeId) renderEmployeeCard();
}

function renderChips() {
  const box = document.getElementById("employeeChips");
  box.innerHTML = "";
  if (employees.length === 0) {
    box.innerHTML = '<span class="sub">Aucun employé enregistré pour l\'instant.</span>';
    return;
  }
  employees.forEach(e => {
    const chip = document.createElement("button");
    chip.className = "chip" + (e.id === currentEmployeeId ? " active" : "");
    chip.textContent = e.name;
    chip.onclick = () => selectEmployee(e.id);
    box.appendChild(chip);
  });
}

function todaysRecordsFor(empId) {
  const today = todayKey(new Date().toISOString());
  return records
    .filter(r => r.employeeId === empId && todayKey(r.ts) === today)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function allowedActionsFor(empId) {
  const last = todaysRecordsFor(empId)[0];
  const lastType = last ? last.type : null;
  if (!lastType) return ["in"];
  if (lastType === "in" || lastType === "pause_end") return ["pause_start", "out"];
  if (lastType === "pause_start") return ["pause_end"];
  return [];
}

function statusFor(empId) {
  const last = todaysRecordsFor(empId)[0];
  const lastType = last ? last.type : null;
  if (!lastType) return { cls: "not-started", label: "Pas encore arrivé" };
  if (lastType === "pause_start") return { cls: "break", label: "En pause" };
  if (lastType === "out") return { cls: "done", label: "Journée terminée" };
  return { cls: "working", label: "En poste" };
}

function selectEmployee(id) {
  currentEmployeeId = id;
  pinUnlocked = false;
  document.getElementById("pinInput").value = "";
  document.getElementById("pinError").textContent = "";
  renderChips();
  renderEmployeeCard();
}

const ACTION_STYLE = {
  in: "btn-primary",
  out: "btn-amber",
  pause_start: "btn-teal",
  pause_end: "btn-primary",
};

function renderEmployeeCard() {
  const emp = employees.find(e => e.id === currentEmployeeId);
  const card = document.getElementById("employeeCard");
  if (!emp) { card.style.display = "none"; return; }
  card.style.display = "block";
  document.getElementById("employeeName").textContent = emp.name;

  if (pinUnlocked) {
    const status = statusFor(emp.id);
    document.getElementById("statusBadge").innerHTML =
      `<span class="status-badge ${status.cls}">${status.label}</span>`;
    const last = todaysRecordsFor(emp.id)[0];
    document.getElementById("lastRecord").textContent = last
      ? `Dernier pointage : ${LABELS[last.type]} à ${fmtTime(last.ts)}`
      : "";
  } else {
    document.getElementById("statusBadge").innerHTML = "";
    document.getElementById("lastRecord").textContent = "";
  }

  document.getElementById("pinSection").style.display = pinUnlocked ? "none" : "block";

  const actions = allowedActionsFor(emp.id);
  const btnBox = document.getElementById("actionButtons");
  if (pinUnlocked && actions.length > 0) {
    btnBox.style.display = "flex";
    btnBox.innerHTML = actions.map(a => `
      <button class="btn ${ACTION_STYLE[a]}" data-action="${a}">${LABELS[a]}</button>
    `).join("");
    btnBox.querySelectorAll("button").forEach(b => {
      b.onclick = () => doPointage(b.dataset.action, b);
    });
  } else {
    btnBox.style.display = "none";
    if (pinUnlocked && actions.length === 0) {
      showError("Journée déjà terminée pour aujourd'hui.");
    }
  }

  if (pinUnlocked) {
    renderToday(emp.id);
  } else {
    document.getElementById("todayCard").style.display = "none";
  }
}

function renderToday(empId) {
  const mine = todaysRecordsFor(empId);
  const box = document.getElementById("todayCard");
  const list = document.getElementById("todayList");
  if (mine.length === 0) { box.style.display = "none"; return; }
  box.style.display = "block";
  list.innerHTML = mine.map(r => `
    <div class="row">
      <span><span class="dot ${r.type}"></span>${LABELS[r.type]}</span>
      <span class="mono">${fmtTime(r.ts)}</span>
    </div>
  `).join("");
}

document.getElementById("pinBtn").onclick = () => {
  const emp = employees.find(e => e.id === currentEmployeeId);
  const val = document.getElementById("pinInput").value;
  if (emp && val === emp.pin) {
    pinUnlocked = true;
    renderEmployeeCard();
  } else {
    document.getElementById("pinError").textContent = "Code PIN incorrect.";
    document.getElementById("pinInput").value = "";
  }
};

document.getElementById("switchUserBtn").onclick = () => {
  currentEmployeeId = null;
  pinUnlocked = false;
  clearError();
  document.getElementById("pinInput").value = "";
  document.getElementById("pinError").textContent = "";
  renderChips();
  renderEmployeeCard();
  document.getElementById("todayCard").style.display = "none";
};
document.getElementById("pinInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("pinBtn").click();
});
document.getElementById("pinInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});

function geoErrorMessage(err) {
  switch (err.code) {
    case 1: return "Localisation bloquée pour ce site. Clique sur le cadenas 🔒 à côté de l'adresse, mets \"Position\" sur Autoriser, puis recharge la page.";
    case 2: return "Position introuvable. Vérifie que le GPS/la localisation est activé sur ton appareil, puis réessaie.";
    case 3: return "La recherche de position a pris trop de temps. Vérifie ta connexion et réessaie.";
    default: return "Localisation refusée ou indisponible. Autorise la géolocalisation pour pointer.";
  }
}

let pendingAction = null;

async function submitPointage(pos) {
  const emp = employees.find(e => e.id === currentEmployeeId);
  try {
    const res = await fetch("/api/records", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        employeeId: currentEmployeeId,
        pin: emp.pin,
        action: pendingAction,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy || 0),
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.error || "Erreur lors de l'enregistrement.");
      setBusy(false);
      return;
    }
    clearError();
    pinUnlocked = false;
    await loadAll();
    setBusy(false);
  } catch (e) {
    showError("Impossible de contacter le serveur.");
    setBusy(false);
  }
}

function setBusy(isBusy) {
  document.querySelectorAll("#actionButtons button").forEach(b => (b.disabled = isBusy));
}

function doPointage(action, btnEl) {
  const emp = employees.find(e => e.id === currentEmployeeId);
  if (!emp || !pinUnlocked) return;
  pendingAction = action;
  clearError();
  setBusy(true);
  if (btnEl) btnEl.textContent = "Localisation…";

  if (window.isSecureContext === false) {
    showError("Cette page n'est pas chargée en HTTPS : la géolocalisation est bloquée par le navigateur.");
    setBusy(false);
    return;
  }
  if (!navigator.geolocation) {
    showError("La géolocalisation n'est pas disponible sur cet appareil ou ce navigateur.");
    setBusy(false);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    submitPointage,
    (err) => {
      if (err.code === 2 || err.code === 3) {
        navigator.geolocation.getCurrentPosition(
          submitPointage,
          (err2) => { showError(geoErrorMessage(err2)); setBusy(false); },
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 }
        );
      } else {
        showError(geoErrorMessage(err));
        setBusy(false);
      }
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

loadAll();
</script>
</body>
</html>
