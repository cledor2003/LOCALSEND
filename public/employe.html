<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKSAM — Espace Collaborateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-overlay: rgba(3, 7, 18, 0.90);
      --card-bg: rgba(15, 23, 42, 0.80);
      --border: rgba(56, 189, 248, 0.15);
      --primary: #38bdf8;
      --accent: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    
    body { 
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: var(--text); 
      min-height: 100vh; 
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container { 
      width: 100%; 
      max-width: 650px; 
    }

    header { 
      background: var(--card-bg); 
      backdrop-filter: blur(20px);
      padding: 24px 30px; 
      border-radius: 20px; 
      border: 1px solid var(--border); 
      margin-bottom: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .user-info h1 { font-size: 1.3rem; color: var(--primary); font-weight: 600; }
    .user-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .status-badge { padding: 6px 14px; border-radius: 30px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-offline { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.4); }
    .status-online { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.4); }
    .status-pause { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.4); }

    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(20px);
      padding: 25px; 
      border-radius: 20px; 
      border: 1px solid var(--border); 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
      margin-bottom: 20px; 
    }

    .card h2 { font-size: 1.05rem; margin-bottom: 18px; color: var(--text); font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    .grid-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
    
    button { border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; font-size: 0.9rem; }
    
    .btn-start { background: var(--success); color: #05070b; }
    .btn-pause { background: var(--warning); color: #05070b; }
    .btn-stop { background: var(--danger); color: white; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    input, textarea { 
      width: 100%; 
      padding: 14px 18px; 
      background: rgba(3, 7, 18, 0.8); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      color: white; 
      font-size: 0.95rem; 
      outline: none; 
      margin-bottom: 15px; 
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { height: 110px; resize: vertical; }

    .btn-submit { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #05070b; 
      font-weight: 700; 
      padding: 14px;
      border-radius: 12px;
    }
    .btn-submit:hover { opacity: 0.9; }

    .location-info { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }
    
    .logout-area { text-align: center; margin-top: 15px; }
    .logout-link { color: var(--danger); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
    .logout-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="user-info">
      <h1 id="employee-name">Employé : Chargement...</h1>
      <p id="clock">--:--:--</p>
    </div>
    <span id="status-tag" class="status-badge status-offline">Hors ligne</span>
  </header>

  <!-- Pointage Télétravail -->
  <div class="card">
    <h2>1. Pointage & Présence à Distance</h2>
    <div class="grid-actions">
      <button id="btn-start" class="btn-start" onclick="updateStatus('ONLINE')">Prise de service</button>
      <button id="btn-pause" class="btn-pause" onclick="updateStatus('PAUSE')" disabled>Pause</button>
      <button id="btn-stop" class="btn-stop" onclick="updateStatus('OFFLINE')" disabled>Fin de journée</button>
    </div>
    <div class="location-info" id="geo-status">📍 Géolocalisation : En attente d'action...</div>
  </div>

  <!-- Rapport d'activité -->
  <div class="card">
    <h2>2. Rapport d'Activité / Tâches Complétées</h2>
    <form id="task-form" onsubmit="submitTask(event)">
      <input type="text" id="app-active" placeholder="Application ou Outil actif (Ex: VS Code, Excel...)" required>
      <textarea id="task-desc" placeholder="Décrivez les tâches effectuées aujourd'hui..." required></textarea>
      <button type="submit" class="btn-submit">Envoyer le rapport quotidien</button>
    </form>
  </div>
  
  <div class="logout-area">
    <a href="/api/logout" class="logout-link">⏻ Se déconnecter de la session</a>
  </div>
</div>

<script>
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  }, 1000);

  async function loadUser() {
    try {
      const res = await fetch('/api/current-user');
      const data = await res.json();
      if (data.loggedIn) {
        document.getElementById('employee-name').textContent = `Collaborateur : ${data.name}`;
      } else {
        window.location.href = '/index.html';
      }
    } catch(e) { console.error(e); }
  }
  loadUser();

  let userLocation = "Non localisé";
  navigator.geolocation.getCurrentPosition(pos => {
    userLocation = `Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`;
    document.getElementById('geo-status').textContent = `📍 Géolocalisation active : ${userLocation}`;
  }, () => {
    document.getElementById('geo-status').textContent = `⚠️ Géolocalisation refusée ou indisponible`;
  });

  async function updateStatus(status) {
    const time = new Date().toLocaleTimeString();
    const currentApp = document.getElementById('app-active').value || 'Général';
    
    const res = await fetch('/api/employe/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, currentApp, location: userLocation, time })
    });

    if (res.ok) {
      const tag = document.getElementById('status-tag');
      tag.className = `status-badge status-${status.toLowerCase()}`;
      tag.textContent = status === 'ONLINE' ? 'En service' : (status === 'PAUSE' ? 'En pause' : 'Hors ligne');
      
      document.getElementById('btn-start').disabled = (status === 'ONLINE');
      document.getElementById('btn-pause').disabled = (status !== 'ONLINE');
      document.getElementById('btn-stop').disabled = (status === 'OFFLINE');
    }
  }

  async function submitTask(e) {
    e.preventDefault();
    const currentApp = document.getElementById('app-active').value;
    const tache = document.getElementById('task-desc').value;

    const res = await fetch('/api/employe/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentApp, tache })
    });

    if (res.ok) {
      alert('Rapport envoyé avec succès !');
      document.getElementById('task-desc').value = '';
    } else {
      alert('Erreur lors de l\'envoi du rapport.');
    }
  }
</script>
</body>
</html>
