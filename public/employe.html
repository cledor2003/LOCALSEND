<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pointage</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">⏱</div>
    <div>
      <h1>Pointage</h1>
      <p>Enregistre ton arrivée et ton départ</p>
    </div>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="card">
    <div class="label">Qui pointe ?</div>
    <div id="employeeChips" class="chip-row"></div>
  </div>

  <div id="employeeCard" style="display:none;" class="card center-card">
    <div class="sub">Connecté en tant que</div>
    <div id="employeeName" class="employee-name"></div>
    <div id="lastRecord" class="sub mono" style="margin-top:8px;"></div>

    <div id="pinSection" style="margin-top:20px; max-width:220px; margin-left:auto; margin-right:auto;">
      <div class="label">🔒 Code PIN</div>
      <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••" />
      <div id="pinError" style="color:#dc2626; font-size:12px; margin-top:4px;"></div>
      <button id="pinBtn" class="btn btn-dark btn-block">Valider le code</button>
    </div>

    <button id="pointBtn" class="btn btn-primary" style="display:none; margin-top:20px; padding:16px 32px; font-size:16px;"></button>
    <div class="sub" style="margin-top:12px;">📍 Ta position sera enregistrée avec l'heure</div>
  </div>

  <div id="todayCard" style="display:none;" class="card">
    <div class="label" style="margin-bottom:8px;">Aujourd'hui</div>
    <div id="todayList"></div>
  </div>
</div>

<script>
let employees = [];
let records = [];
let currentEmployeeId = null;
let pinUnlocked = false;

const errorBox = document.getElementById("error");
function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}
function clearError() {
  errorBox.style.display = "none";
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function todayKey(iso) {
  return new Date(iso).toISOString().slice(0, 10);
}

async function loadAll() {
  const [empRes, recRes] = await Promise.all([
    fetch("/api/employees"), fetch("/api/records")
  ]);
  employees = await empRes.json();
  records = await recRes.json();
  renderChips();
  if (currentEmployeeId) selectEmployee(currentEmployeeId, true);
}

function renderChips() {
  const box = document.getElementById("employeeChips");
  box.innerHTML = "";
  if (employees.length === 0) {
    box.innerHTML = '<span class="sub">Aucun employé enregistré pour l\'instant.</span>';
    return;
  }
  employees.forEach(e => {
    const chip = document.createElement("button");
    chip.className = "chip" + (e.id === currentEmployeeId ? " active" : "");
    chip.textContent = e.name;
    chip.onclick = () => selectEmployee(e.id);
    box.appendChild(chip);
  });
}

function lastRecordFor(empId) {
  return records
    .filter(r => r.employeeId === empId)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts))[0] || null;
}
function nextActionFor(empId) {
  const last = lastRecordFor(empId);
  return (!last || last.type === "out") ? "in" : "out";
}

function selectEmployee(id, silent) {
  currentEmployeeId = id;
  pinUnlocked = false;
  document.getElementById("pinInput").value = "";
  document.getElementById("pinError").textContent = "";
  renderChips();
  renderEmployeeCard();
}

function renderEmployeeCard() {
  const emp = employees.find(e => e.id === currentEmployeeId);
  const card = document.getElementById("employeeCard");
  if (!emp) { card.style.display = "none"; return; }
  card.style.display = "block";
  document.getElementById("employeeName").textContent = emp.name;

  const last = lastRecordFor(emp.id);
  document.getElementById("lastRecord").textContent = last
    ? `Dernier pointage : ${last.type === "in" ? "Arrivée" : "Départ"} à ${fmtTime(last.ts)}`
    : "";

  document.getElementById("pinSection").style.display = pinUnlocked ? "none" : "block";
  const pointBtn = document.getElementById("pointBtn");
  pointBtn.style.display = pinUnlocked ? "inline-block" : "none";
  const action = nextActionFor(emp.id);
  pointBtn.className = "btn " + (action === "in" ? "btn-primary" : "btn-amber");
  pointBtn.textContent = action === "in" ? "Pointer l'arrivée" : "Pointer le départ";

  renderToday(emp.id);
}

function renderToday(empId) {
  const today = todayKey(new Date().toISOString());
  const mine = records
    .filter(r => r.employeeId === empId && todayKey(r.ts) === today)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const box = document.getElementById("todayCard");
  const list = document.getElementById("todayList");
  if (mine.length === 0) { box.style.display = "none"; return; }
  box.style.display = "block";
  list.innerHTML = mine.map(r => `
    <div class="row">
      <span><span class="dot ${r.type}"></span>${r.type === "in" ? "Arrivée" : "Départ"}</span>
      <span class="mono">${fmtTime(r.ts)}</span>
    </div>
  `).join("");
}

document.getElementById("pinBtn").onclick = () => {
  const emp = employees.find(e => e.id === currentEmployeeId);
  const val = document.getElementById("pinInput").value;
  if (emp && val === emp.pin) {
    pinUnlocked = true;
    renderEmployeeCard();
  } else {
    document.getElementById("pinError").textContent = "Code PIN incorrect.";
    document.getElementById("pinInput").value = "";
  }
};
document.getElementById("pinInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("pinBtn").click();
});
document.getElementById("pinInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});

function geoErrorMessage(err) {
  switch (err.code) {
    case 1: return "Localisation bloquée pour ce site. Clique sur le cadenas 🔒 à côté de l'adresse, mets \"Position\" sur Autoriser, puis recharge la page.";
    case 2: return "Position introuvable. Vérifie que le GPS/la localisation est activé sur ton appareil, puis réessaie.";
    case 3: return "La recherche de position a pris trop de temps. Vérifie ta connexion et réessaie.";
    default: return "Localisation refusée ou indisponible. Autorise la géolocalisation pour pointer.";
  }
}

async function submitPointage(pos) {
  const emp = employees.find(e => e.id === currentEmployeeId);
  const pin = document.getElementById("pinInput").value || (pinUnlocked ? lastValidPin : "");
  try {
    const res = await fetch("/api/records", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        employeeId: currentEmployeeId,
        pin: currentPin,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy || 0),
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.error || "Erreur lors de l'enregistrement.");
      setBusy(false);
      return;
    }
    clearError();
    pinUnlocked = false;
    await loadAll();
    setBusy(false);
  } catch (e) {
    showError("Impossible de contacter le serveur.");
    setBusy(false);
  }
}

let currentPin = "";
function setBusy(isBusy) {
  const btn = document.getElementById("pointBtn");
  btn.disabled = isBusy;
}

document.getElementById("pointBtn").onclick = () => {
  const emp = employees.find(e => e.id === currentEmployeeId);
  if (!emp || !pinUnlocked) return;
  currentPin = emp.pin; // already verified client-side, sent for server-side check too
  clearError();
  setBusy(true);

  if (window.isSecureContext === false) {
    showError("Cette page n'est pas chargée en HTTPS : la géolocalisation est bloquée par le navigateur.");
    setBusy(false);
    return;
  }
  if (!navigator.geolocation) {
    showError("La géolocalisation n'est pas disponible sur cet appareil ou ce navigateur.");
    setBusy(false);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    submitPointage,
    (err) => {
      if (err.code === 2 || err.code === 3) {
        navigator.geolocation.getCurrentPosition(
          submitPointage,
          (err2) => { showError(geoErrorMessage(err2)); setBusy(false); },
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 }
        );
      } else {
        showError(geoErrorMessage(err));
        setBusy(false);
      }
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
};

loadAll();
</script>
</body>
</html>
