<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Espace Collaborateur — AKSAM</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Styles complémentaires pour le mode clair sur la page de login */
  body.light-mode .card,
  body.light-mode .hero {
    background: rgba(255, 255, 255, 0.9) !important;
    border-color: rgba(0, 0, 0, 0.1) !important;
    color: #0f172a !important;
  }
  body.light-mode .hero-brand,
  body.light-mode input {
    color: #0f172a !important;
  }
  body.light-mode input {
    background: rgba(241, 245, 249, 0.9) !important;
    border-color: rgba(0, 0, 0, 0.15) !important;
  }
  body.light-mode .hero-tagline,
  body.light-mode .label,
  body.light-mode .footnote a {
    color: #64748b !important;
  }
</style>
</head>
<body>
<div class="wrap" style="max-width:420px; padding-top:60px;">
  <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
    <button id="themeToggle" class="theme-toggle" title="Changer de thème">☀️</button>
  </div>
  <div class="hero" style="padding:32px 24px;">
    <div class="hero-mark" style="width:64px; height:64px;">
      <img src="/logo.svg" alt="Logo AKSAM" width="40" height="40" />
    </div>
    <h1 class="hero-brand" style="font-size:26px;">AKSAM ENTERPRISE</h1>
    <p class="hero-tagline">Système de Suivi & Télétravail (Employé)</p>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="card">
    <div class="label">Nom complet (Identifiant Employé)</div>
    <input type="text" id="username" placeholder="Ex: Amadou Sow" />

    <div class="label" style="margin-top:16px;">Code PIN secret</div>
    <input type="password" id="pin" placeholder="••••" style="letter-spacing:normal; font-size:15px; text-align:left;" />

    <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:22px;">Accéder à mon espace</button>
  </div>

  <p class="footnote"><a href="/login.html" style="color:var(--text-dim); text-decoration:none;">🔒 Accès Espace Administration</a></p>
</div>

<script>
  // Gestion directe du thème sombre/clair
  document.addEventListener('DOMContentLoaded', () => {
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      const savedTheme = localStorage.getItem('ak_theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        themeToggle.textContent = '🌙';
      } else {
        themeToggle.textContent = '☀️';
      }

      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        themeToggle.textContent = isLight ? '🌙' : '☀️';
        localStorage.setItem('ak_theme', isLight ? 'light' : 'dark');
      });
    }
  });

  const errorBox = document.getElementById("error");
  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
  function clearError() { errorBox.style.display = "none"; }

  async function attemptEmployeLogin() {
    clearError();
    const username = document.getElementById("username").value.trim();
    const pin = document.getElementById("pin").value.trim();
    const btn = document.getElementById("loginBtn");
    
    if (!username) {
      showError("Veuillez saisir votre nom d'employé.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Connexion…";
    
    try {
      const res = await fetch("/api/employe/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, pin }),
      });
      
      const data = await res.json().catch(() => null);

      if (res.ok && data && data.success) {
        window.location.href = "/employe.html";
        return;
      }
      
      showError((data && data.error) || "Nom d'employé ou code PIN incorrect.");
    } catch (e) {
      showError("Impossible de contacter le serveur.");
    }
    
    btn.disabled = false;
    btn.textContent = "Accéder à mon espace";
  }

  document.getElementById("loginBtn").onclick = attemptEmployeLogin;
  document.getElementById("pin").addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptEmployeLogin();
  });
</script>
</body>
</html>
