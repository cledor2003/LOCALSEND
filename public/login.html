<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion Administrateur — AKSAM</title>
<link rel="stylesheet" href="style.css" />
<script src="/theme.js"></script>
</head>
<body>
<div class="wrap" style="max-width:420px; padding-top:60px;">
  <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
    <button id="themeToggle" class="theme-toggle" title="Changer de thème">☀️</button>
  </div>
  <div class="hero" style="padding:32px 24px;">
    <div class="hero-mark" style="width:64px; height:64px;">
      <img src="/logo.svg" alt="Logo AKSAM" width="40" height="40" />
    </div>
    <h1 class="hero-brand" style="font-size:26px;">AKSAM ADMIN</h1>
    <p class="hero-tagline">Portail de Gestion & Administration</p>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="card">
    <div class="label">Identifiant Administrateur</div>
    <input type="text" id="username" placeholder="admin" autocomplete="username" />

    <div class="label" style="margin-top:16px;">Mot de passe</div>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="letter-spacing:normal; font-size:15px; text-align:left;" />

    <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:22px;">Se connecter à l'Admin</button>
  </div>

  <p class="footnote"><a href="/index.html" style="color:var(--text-dim); text-decoration:none;">← Accès au Portail Employés</a></p>
</div>

<script>
const errorBox = document.getElementById("error");
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function clearError() { errorBox.style.display = "none"; }

async function attemptAdminLogin() {
  clearError();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  
  if (!username || !password) {
    showError("Veuillez saisir l'identifiant et le mot de passe.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Connexion en cours…";
  
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    
    const data = await res.json().catch(() => null);

    if (res.ok && data && data.success) {
      window.location.href = "/admin.html";
      return;
    }
    
    showError((data && data.error) || "Identifiants administrateur incorrects.");
  } catch (e) {
    showError("Impossible de contacter le serveur.");
  }
  
  btn.disabled = false;
  btn.textContent = "Se connecter à l'Admin";
}

document.getElementById("loginBtn").onclick = attemptAdminLogin;
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") attemptAdminLogin();
});
</script>
</body>
</html>
