<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivi admin - AKSAM</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header" style="justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="logo"><img src="/logo.svg" alt="Logo AKSAM" /></div>
      <div>
        <h1>AKSAM — Suivi admin</h1>
        <p>Tableau de bord de présence</p>
      </div>
    </div>
    <div class="flex-row">
      <button id="themeToggle" class="theme-toggle" title="Changer de thème">☀️</button>
      <button onclick="loadAll()" class="btn btn-dark" style="padding:8px 12px; font-size:12px;">↻ Actualiser</button>
      <button id="logoutBtn" class="btn btn-dark" style="padding:8px 12px; font-size:12px;">⎋ Déconnexion</button>
    </div>
  </div>

  <div id="error" class="error-box" style="display:none;"></div>

  <div class="stats-grid">
    <div class="stat present"><div class="label">Présents</div><div id="statPresent" class="value">0</div></div>
    <div class="stat break"><div class="label">En pause</div><div id="statBreak" class="value">0</div></div>
    <div class="stat late"><div class="label">En retard</div><div id="statLate" class="value">0</div></div>
    <div class="stat absent"><div class="label">Absents</div><div id="statAbsent" class="value">0</div></div>
  </div>

  <div class="card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:16px;">
    <div id="notifStatus" class="sub">🔕 Alertes de retard désactivées</div>
    <div class="flex-row">
      <button id="notifBtn" class="btn btn-primary">Activer les alertes</button>
      <button id="exportBtn" class="btn btn-dark">⬇ Exporter Excel</button>
      <button id="cleanupBtn" class="btn btn-dark">🧹 Nettoyer les pointages orphelins</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div class="label">👥 Employés (<span id="empCount">0</span>)</div>
      <div class="flex-row" style="align-items:center;">
        <span class="sub">Heure limite</span>
        <input type="time" id="startTime" style="width:120px; margin:0;" />
      </div>
    </div>
    <div class="flex-row" style="margin-top:10px;">
      <input type="text" id="newName" class="flex-1" placeholder="Nom de l'employé" />
      <input type="text" id="newPin" style="width:160px;" placeholder="PIN (4 chiffres, optionnel)" maxlength="4" />
      <button id="addBtn" class="btn btn-dark">+ Ajouter</button>
    </div>
    <div id="createdPin" class="sub" style="display:none; margin-top:8px; background:rgba(45,212,191,0.1); border:1px solid rgba(45,212,191,0.35); border-radius:10px; padding:8px 10px; color:var(--teal);"></div>
    <div id="employeeTags" class="chip-row"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:10px;">Historique des pointages</div>
    <div id="history" class="history"></div>
  </div>

  <div class="footnote">🛡 Ce tableau de bord est réservé à l'administration — ne partage ce lien qu'avec les personnes autorisées.</div>
</div>

<script>
let employees = [];
let records = [];
let startTime = "08:00";
let notifyEnabled = false;
let notifiedAbsent = new Set();

const LABELS = { in: "arrivée", out: "départ", pause_start: "début de pause", pause_end: "fin de pause" };

const errorBox = document.getElementById("error");
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function clearError() { errorBox.style.display = "none"; }

function fmtTime(iso) { return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short" }); }
function todayKey(iso) { return new Date(iso).toISOString().slice(0, 10); }

async function loadAll() {
  try {
    const [empRes, recRes, setRes] = await Promise.all([
      fetch("/api/employees"), fetch("/api/records"), fetch("/api/settings")
    ]);
    if (empRes.status === 401) { window.location.href = "/login.html"; return; }
    employees = await empRes.json();
    records = await recRes.json();
    const settings = await setRes.json();
    startTime = settings.startTime || "08:00";
    document.getElementById("startTime").value = startTime;
    clearError();
    render();
  } catch (e) {
    showError("Impossible de contacter le serveur.");
  }
}

document.getElementById("logoutBtn").onclick = async () => {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login.html";
};

const addressCache = {};

async function loadAddresses(recordsToResolve) {
  for (const r of recordsToResolve) {
    const key = `${r.lat.toFixed(4)},${r.lng.toFixed(4)}`;
    const el = document.getElementById(`addr_${r.id}`);
    if (!el) continue;
    if (addressCache[key]) { el.textContent = `📍 ${addressCache[key]}`; continue; }
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${r.lat}&lon=${r.lng}&zoom=18&addressdetails=1`,
        { headers: { "Accept-Language": "fr" } }
      );
      const data = await res.json();
      const a = data.address || {};
      const parts = [
        [a.house_number, a.road].filter(Boolean).join(" "),
        a.neighbourhood || a.suburb,
        a.city || a.town || a.village || a.county,
      ].filter(Boolean);
      const label = parts.length ? parts.join(", ") : (data.display_name || "Adresse introuvable");
      addressCache[key] = label;
      if (document.getElementById(`addr_${r.id}`)) document.getElementById(`addr_${r.id}`).textContent = `📍 ${label}`;
    } catch (e) {
      if (document.getElementById(`addr_${r.id}`)) document.getElementById(`addr_${r.id}`).textContent = "📍 Adresse indisponible";
    }
    await new Promise(res => setTimeout(res, 300));
  }
}

function render() {
  const todayStr = todayKey(new Date().toISOString());
  const todayRecords = records.filter(r => todayKey(r.ts) === todayStr);

  // dernier statut du jour par employé
  const lastByEmp = {};
  todayRecords.forEach(r => {
    if (!lastByEmp[r.employeeId] || new Date(r.ts) > new Date(lastByEmp[r.employeeId].ts)) {
      lastByEmp[r.employeeId] = r;
    }
  });

  const presentIds = new Set(Object.entries(lastByEmp).filter(([id, r]) => r.type !== "out" && r.type !== undefined && (r.type === "in" || r.type === "pause_start" || r.type === "pause_end")).map(([id]) => id));
  const breakIds = new Set(Object.entries(lastByEmp).filter(([id, r]) => r.type === "pause_start").map(([id]) => id));
  const lateIds = new Set(todayRecords.filter(r => {
    if (r.type !== "in") return false;
    const t = new Date(r.ts);
    const [h, m] = startTime.split(":").map(Number);
    const limit = new Date(t); limit.setHours(h, m, 0, 0);
    return t > limit;
  }).map(r => r.employeeId));
  const absentCount = Math.max(employees.length - presentIds.size, 0);

  document.getElementById("statPresent").textContent = presentIds.size;
  document.getElementById("statBreak").textContent = breakIds.size;
  document.getElementById("statLate").textContent = lateIds.size;
  document.getElementById("statAbsent").textContent = absentCount;
  document.getElementById("empCount").textContent = employees.length;

  const tags = document.getElementById("employeeTags");
  tags.innerHTML = employees.map(e => {
    let icon = "⚠️";
    if (breakIds.has(e.id)) icon = "☕";
    else if (presentIds.has(e.id)) icon = "✅";
    return `
      <span class="chip" style="cursor:default; display:inline-flex; align-items:center; gap:8px;">
        ${icon} ${e.name}
        <span class="pin-tag">· PIN ${e.pin}</span>
        <button class="delete-emp-btn" data-id="${e.id}" data-name="${e.name}" title="Supprimer cet employé"
          style="background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; padding:0; line-height:1;">✕</button>
      </span>
    `;
  }).join("");
  tags.querySelectorAll(".delete-emp-btn").forEach(btn => {
    btn.onclick = () => deleteEmployee(btn.dataset.id, btn.dataset.name);
  });

  const allSorted = [...records].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const historyBox = document.getElementById("history");
  if (allSorted.length === 0) {
    historyBox.innerHTML = '<span class="sub">Aucun pointage enregistré pour le moment.</span>';
  } else {
    historyBox.innerHTML = allSorted.map(r => {
      const emp = employees.find(e => e.id === r.employeeId);
      const addrId = `addr_${r.id}`;
      return `
        <div class="row" style="align-items:flex-start;">
          <div>
            <span class="dot ${r.type}"></span>
            <strong>${emp ? emp.name : "Employé supprimé"}</strong>
            <span class="sub">${LABELS[r.type] || r.type}</span>
            <div id="${addrId}" class="sub" style="margin-top:2px; max-width:320px;">📍 Recherche de l'adresse…</div>
          </div>
          <div style="text-align:right;">
            <div class="mono sub">${fmtDate(r.ts)} · ${fmtTime(r.ts)}</div>
            <a class="maplink" target="_blank" href="https://www.google.com/maps?q=${r.lat},${r.lng}">🗺 voir sur la carte</a>
          </div>
        </div>
      `;
    }).join("");
    loadAddresses(allSorted.slice(0, 25));
  }

  checkAbsences(presentIds, todayStr);
}

document.getElementById("startTime").onchange = async (e) => {
  startTime = e.target.value;
  await fetch("/api/settings", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ startTime }),
  });
  render();
};

document.getElementById("addBtn").onclick = async () => {
  const name = document.getElementById("newName").value.trim();
  const pin = document.getElementById("newPin").value.trim();
  if (!name) return;
  const res = await fetch("/api/employees", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, pin }),
  });
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const emp = await res.json();
  document.getElementById("newName").value = "";
  document.getElementById("newPin").value = "";
  const box = document.getElementById("createdPin");
  box.style.display = "block";
  box.textContent = `Code PIN de ${emp.name} : ${emp.pin} — communique-le en privé à l'employé.`;
  await loadAll();
};

async function deleteEmployee(id, name) {
  const confirmed = confirm(`Supprimer ${name} ? Tout son historique de pointages sera aussi supprimé définitivement de la base de données.`);
  if (!confirmed) return;
  const res = await fetch(`/api/employees/${id}`, { method: "DELETE" });
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  await loadAll();
}

document.getElementById("cleanupBtn").onclick = async () => {
  const confirmed = confirm("Supprimer définitivement tous les pointages liés à des employés déjà supprimés ? Cette action est irréversible.");
  if (!confirmed) return;
  const res = await fetch("/api/records/orphaned", { method: "DELETE" });
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  alert(`${data.deleted} pointage(s) orphelin(s) supprimé(s).`);
  await loadAll();
};

document.getElementById("exportBtn").onclick = () => {
  const rows = [...records].sort((a, b) => new Date(b.ts) - new Date(a.ts)).map(r => {
    const emp = employees.find(e => e.id === r.employeeId);
    const d = new Date(r.ts);
    return {
      Employe: emp ? emp.name : "Employé supprimé",
      Type: LABELS[r.type] || r.type,
      Date: d.toLocaleDateString("fr-FR"),
      Heure: d.toLocaleTimeString("fr-FR"),
      Latitude: r.lat,
      Longitude: r.lng,
      "Précision (m)": r.accuracy,
      Lien: `https://www.google.com/maps?q=${r.lat},${r.lng}`,
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 18 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 40 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Pointages");
  XLSX.writeFile(wb, `pointages_${todayKey(new Date().toISOString())}.xlsx`);
};

document.getElementById("notifBtn").onclick = async () => {
  if (typeof Notification === "undefined") {
    showError("Les notifications ne sont pas supportées sur ce navigateur.");
    return;
  }
  const perm = await Notification.requestPermission();
  notifyEnabled = perm === "granted";
  document.getElementById("notifStatus").textContent = notifyEnabled ? "🔔 Alertes de retard activées" : "🔕 Alertes de retard désactivées";
  document.getElementById("notifBtn").style.display = notifyEnabled ? "none" : "inline-block";
  if (!notifyEnabled) showError("Notifications refusées. Active-les dans les réglages du navigateur.");
};

function checkAbsences(presentIds, todayStr) {
  if (!notifyEnabled || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const now = new Date();
  const [h, m] = startTime.split(":").map(Number);
  const limit = new Date(now); limit.setHours(h, m + 10, 0, 0);
  if (now < limit) return;
  employees.forEach(emp => {
    const key = `${emp.id}_${todayStr}`;
    if (!presentIds.has(emp.id) && !notifiedAbsent.has(key)) {
      notifiedAbsent.add(key);
      new Notification("Absence non pointée", { body: `${emp.name} n'a pas encore pointé son arrivée.` });
    }
  });
}

loadAll();
setInterval(loadAll, 20000);
</script>
</body>
</html>
